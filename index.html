<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Trainer Defense</title>
<meta name="description" content="An RPG practice lab for AI trainers: hunt bugs and feature requests in replica apps, file CheckSet rubric findings, level up your trainer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app/game.css">
</head>
<body>
<div class="shell">
<header class="top">
<button class="brand" id="homeBtn" aria-label="AI Trainer Defense title screen">
<svg width="34" height="34" viewBox="0 0 38 38" fill="none" aria-hidden="true"><path d="M19 2 L34 8 V18 C34 27 27.5 33.5 19 36 C10.5 33.5 4 27 4 18 V8 Z" stroke="#7B9BFF" stroke-width="2.2"/><circle cx="19" cy="18" r="6" stroke="#F2B544" stroke-width="2"/><path d="M19 9 V13 M19 23 V27 M10 18 H14 M24 18 H28" stroke="#F2B544" stroke-width="2" stroke-linecap="round"/></svg>
<span><b>AI Trainer Defense</b><span>AI Data Lab</span></span>
</button>
<div class="top-r">
<button class="ico" id="musBtn" aria-pressed="false" aria-label="Background music"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 12.5V3.5l7-1.5v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="4.3" cy="12.5" r="1.9" fill="currentColor"/><circle cx="11.3" cy="11" r="1.9" fill="currentColor"/></svg></button>
<button class="ico" id="sfxBtn" aria-pressed="true" aria-label="Sound effects"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
<div class="rank" id="rankBox"></div>
</div>
</header>
<main class="screen" id="title"></main>
<main class="screen" id="lobby" hidden></main>
<main class="screen mission" id="mission" hidden></main>
<main class="screen" id="results" hidden></main>
</div>
<div class="brief" id="brief" hidden role="dialog" aria-modal="true" aria-label="Mission briefing"></div>
<div class="modal" id="builder" hidden role="dialog" aria-modal="true" aria-labelledby="bTitle"><div class="sheet" id="bSheet"></div></div>
<div class="modal hi" id="how" hidden role="dialog" aria-modal="true" aria-labelledby="howTitle"></div>
<div class="modal hi" id="rankup" hidden role="dialog" aria-modal="true" aria-labelledby="ruTitle"></div>
<div class="modal hi" id="assessM" hidden role="dialog" aria-modal="true" aria-label="Performance assessment"></div>
<div class="intro" id="intro" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app/game.js"></script>
</body>
</html>
